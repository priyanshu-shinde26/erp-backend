spring.application.name=erp-backend
server.port=${PORT:8080}

# H2 in-memory database
spring.datasource.url=jdbc:h2:mem:erpdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Firebase
firebase.database-url=${FIREBASE_DATABASE_URL}
firebase.storage-bucket=${FIREBASE_STORAGE_BUCKET}

# Supabase
supabase.url=${SUPABASE_URL}
supabase.api.key=${SUPABASE_API_KEY}

# Cloudinary
cloudinary.cloud_name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api_key=${CLOUDINARY_API_KEY}
cloudinary.api_secret=${CLOUDINARY_API_SECRET}
CLOUDINARY_URL=${CLOUDINARY_URL}

# AI
openrouter.api.key=${OPENROUTER_API_KEY}
openrouter.api.url=https://openrouter.ai/api/v1/chat/completions
app.site.url=https://campussync.app
app.site.name=CampusSync ERP

# Upload limits
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

logging.level.com.erp.erpbackend.ai=INFO
